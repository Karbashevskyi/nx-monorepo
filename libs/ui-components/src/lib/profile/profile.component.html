<!-- Profile -->
<div class="relative">
  <!-- soft accent glow -->
  <div aria-hidden="true"
       class="pointer-events-none absolute print:hidden -top-24 -start-24 size-72 rounded-full bg-lime-400/20 blur-3xl dark:bg-lime-400/10"></div>

  <div class="relative flex flex-col gap-6 sm:flex-row sm:items-center">
    <div class="shrink-0">
      <img class="size-24 sm:size-28 rounded-2xl object-cover ring-2 ring-lime-400/70 ring-offset-4 ring-offset-white dark:ring-offset-neutral-950"
           src="./images/Ivan-Karbashevskyi.jpeg"
           alt="Ivan Karbashevskyi Photo">
    </div>

    <div class="grow">
      <p class="mb-2 inline-flex items-center gap-x-2 font-mono text-xs text-neutral-500 dark:text-neutral-400">
        <span class="relative flex size-2">
          <span class="absolute inline-flex size-full animate-ping print:hidden rounded-full bg-lime-400 opacity-60"></span>
          <span class="relative inline-flex size-2 rounded-full bg-lime-400"></span>
        </span>
        <span i18n="@@profile_location">Warsaw, Poland</span>
      </p>
      <h1 class="text-3xl sm:text-5xl font-extrabold tracking-tight text-neutral-950 dark:text-white" i18n>
        Ivan Karbashevskyi
      </h1>
      <p class="mt-2 font-mono text-sm sm:text-base text-lime-700 dark:text-lime-400" i18n="@@profile_title">
        Full-stack Developer · Frontend Tech Lead
      </p>
    </div>
  </div>

  <!-- Key numbers -->
  <dl class="relative mt-10 grid grid-cols-3 divide-x divide-neutral-200 rounded-2xl border border-neutral-200 dark:divide-neutral-800 dark:border-neutral-800">
    <div class="flex flex-col justify-between gap-2 p-4 sm:p-5">
      <dt class="font-mono text-[11px] uppercase tracking-wider text-neutral-500" i18n="@@stat_years_commercial_label">Years of commercial development</dt>
      <dd class="mt-1 text-2xl sm:text-3xl font-bold text-neutral-950 dark:text-white">13+</dd>
    </div>
    <div class="flex flex-col justify-between gap-2 p-4 sm:p-5">
      <dt class="font-mono text-[11px] uppercase tracking-wider text-neutral-500" i18n="@@stat_solo_label">Products built solo</dt>
      <dd class="mt-1 text-2xl sm:text-3xl font-bold text-neutral-950 dark:text-white">70%+</dd>
    </div>
    <div class="flex flex-col justify-between gap-2 p-4 sm:p-5">
      <dt class="font-mono text-[11px] uppercase tracking-wider text-neutral-500" i18n="@@stat_degrees_label">CS degrees</dt>
      <dd class="mt-1 text-2xl sm:text-3xl font-bold text-neutral-950 dark:text-white">2</dd>
    </div>
  </dl>
</div>
<!-- End Profile -->
